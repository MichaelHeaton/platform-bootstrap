# terraform-apply.yml
#
# Runs after a pull request is merged to main.  It re-runs plan (to catch any
# drift that occurred between the PR plan and the merge) and then applies.
# The PR process (branch protection + terraform-plan required check) is the
# approval gate — no additional manual step needed after merge.
#
# Authentication: OIDC only — no static AWS credentials anywhere.

name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read       # checkout
  id-token: write      # OIDC token exchange with AWS STS
  pull-requests: write # post apply comment on the originating PR

# Shares the group with terraform-plan so a running plan is cancelled before
# apply starts. cancel-in-progress: false — never abort an in-flight apply.
concurrency:
  group: terraform-platform-bootstrap
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    # Links this run to the `production` environment so GitHub creates a
    # deployment record and surfaces apply status on the originating PR page.
    # Required reviewers are disabled on the environment — no approval gate.
    environment: production

    # TF_VAR_* values are set at the job level so every Terraform step
    # automatically sees them without repeating the env block per-step.
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET_NAME }}
      TF_VAR_github_org: ${{ vars.GH_ORG }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Source code
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # -----------------------------------------------------------------------
      # 2. AWS credentials via OIDC
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/platform-bootstrap-github-actions
          aws-region: ${{ vars.AWS_REGION }}

      # -----------------------------------------------------------------------
      # 3. Terraform
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.10"

      # -----------------------------------------------------------------------
      # 4. Init — same backend-config pattern as plan workflow
      # -----------------------------------------------------------------------
      - name: Terraform Init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET_NAME }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # -----------------------------------------------------------------------
      # 5. Plan — generate a plan file so that apply uses exactly what was
      #    reviewed. A failure here stops the job before any apply occurs.
      #    Unlike terraform-plan.yml this step does NOT use continue-on-error
      #    because we want the job to fail hard if planning fails post-merge.
      # -----------------------------------------------------------------------
      - name: Terraform Plan
        run: |
          terraform -chdir=terraform plan \
            -out=tfplan \
            -no-color

      # -----------------------------------------------------------------------
      # 6. Apply — continue-on-error so the comment step always runs and the
      #    PR author sees the result inline rather than having to open the log.
      # -----------------------------------------------------------------------
      - name: Terraform Apply
        id: apply
        continue-on-error: true
        run: |
          terraform -chdir=terraform apply -auto-approve tfplan \
            2>&1 | tee /tmp/tfapply_output.txt

      # -----------------------------------------------------------------------
      # 7. Post apply output as a comment on the PR that triggered this push.
      #    Uses listPullRequestsAssociatedWithCommit to find the right PR.
      #    Deletes any previous apply comment to keep the timeline clean.
      # -----------------------------------------------------------------------
      - name: Post apply comment
        uses: actions/github-script@v9
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');

            let applyOutput = '';
            try {
              applyOutput = fs.readFileSync('/tmp/tfapply_output.txt', 'utf8');
            } catch (e) {
              applyOutput = '(apply output not available — check workflow logs)';
            }
            const MAX_LEN = 60000;
            if (applyOutput.length > MAX_LEN) {
              applyOutput =
                applyOutput.substring(0, MAX_LEN) +
                '\n\n... output truncated — see full log in the workflow run.';
            }

            const outcome = process.env.APPLY_OUTCOME;
            const icon    = outcome === 'success' ? '✅' : '❌';
            const runUrl  = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `## ${icon} Terraform Apply`,
              '',
              `**Outcome:** \`${outcome}\` | **Run by:** @${context.actor} | [View run](${runUrl})`,
              '',
              '<details>',
              '<summary>Click to expand apply output</summary>',
              '',
              '```',
              applyOutput,
              '```',
              '</details>',
            ].join('\n');

            // Best-effort PR comment — a failure here must not mask a successful apply.
            try {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                commit_sha: context.sha,
              });

              if (prs.length === 0) {
                console.log('No PR associated with this commit — skipping comment.');
              } else {
                const prNumber = prs[0].number;

                // Delete any previous apply comment so only the latest is shown.
                const { data: comments } = await github.rest.issues.listComments({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: prNumber,
                });
                for (const comment of comments) {
                  if (
                    comment.user.type === 'Bot' &&
                    comment.body.includes('## ') &&
                    comment.body.includes('Terraform Apply')
                  ) {
                    await github.rest.issues.deleteComment({
                      owner:      context.repo.owner,
                      repo:       context.repo.repo,
                      comment_id: comment.id,
                    });
                  }
                }

                await github.rest.issues.createComment({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: prNumber,
                  body,
                });
              }
            } catch (e) {
              console.log(`Warning: could not post apply comment — ${e.message}`);
            }

            // Propagate apply failure so the job is marked red and the
            // runbook reminder fires in the next step.
            if (outcome !== 'success') {
              core.setFailed('Terraform apply failed — see comment on originating PR for details.');
            }

      # -----------------------------------------------------------------------
      # 8. Failure notice — only runs when apply failed.
      #    Reminds the operator to check state consistency before retrying.
      # -----------------------------------------------------------------------
      - name: Notify on apply failure
        if: failure()
        run: |
          echo "::error::APPLY FAILED — check state consistency before re-running."
          echo "::error::See docs/runbooks/02-bootstrap.md for recovery steps."
          echo ""
          echo "Common causes:"
          echo "  - Provider API errors (transient; safe to retry)"
          echo "  - State lock held by another run (check S3 + DynamoDB)"
          echo "  - Resource already exists outside of Terraform (import required)"
          echo ""
          echo "DO NOT re-run apply blindly. Read the runbook first."
