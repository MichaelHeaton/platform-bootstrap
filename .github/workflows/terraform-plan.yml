# terraform-validate.yml
#
# Runs on every pull request that touches Terraform code.
# Fast fmt + validate check only — plan and apply are handled by HCP Terraform
# via the VCS integration on the McCleaton-Bootstrap/platform-bootstrap workspace.

name: Terraform Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.10"
          cli_config_credentials_token: ${{ secrets.TF_TOKEN_app_terraform_io }}

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=terraform validate
